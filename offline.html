<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Portfolio OS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:var(--bg);color:var(--text);font-family:var(--font-mono);">
  <div style="text-align:center;max-width:400px;padding:20px;">
    <div style="font-size:48px;margin-bottom:20px;">📡</div>
    <div style="font-size:24px;font-weight:700;color:var(--primary);margin-bottom:10px;">You're offline</div>
    <div style="color:var(--muted);margin-bottom:30px;">No internet connection detected. Some features may not be available until you reconnect.</div>
    <button onclick="location.reload()" style="background:linear-gradient(135deg, rgba(0,255,136,.12), rgba(0,217,255,.12));border:1px solid var(--primary);color:var(--primary);padding:10px 20px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;">Try Again</button>
  </div>
</body>
</html>
