<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Offline — Portfolio OS</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#050505; --primary:#00FF88; --secondary:#00D9FF; --warning:#FFC857; --muted:#999; --text:#F5F5F5; }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',ui-monospace,monospace;}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .code{color:var(--warning);font-size:15px;letter-spacing:2px;margin-bottom:18px;}
  h1{font-size:22px;margin:0 0 10px;color:var(--text);}
  p{color:var(--muted);font-size:14px;max-width:440px;line-height:1.6;}
  button{margin-top:24px;border:1px solid var(--primary);color:var(--primary);background:transparent;padding:10px 18px;border-radius:8px;font-size:13px;font-family:inherit;cursor:pointer;}
  button:hover{box-shadow:0 0 12px rgba(0,255,136,.45);}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warning);margin-right:8px;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="code"><span class="dot"></span>CONNECTION LOST</div>
    <h1>You're offline</h1>
    <p>Portfolio OS couldn't reach the network, and this page hasn't been cached yet. Reconnect and try again — previously visited sections will keep working offline once cached.</p>
    <button onclick="location.reload()">Retry connection</button>
  </div>
</body>
</html>
