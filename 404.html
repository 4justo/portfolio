<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Portfolio OS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:var(--bg);color:var(--text);font-family:var(--font-mono);">
  <div style="text-align:center;">
    <div style="font-size:120px;font-weight:900;color:var(--primary);text-shadow:var(--glow-p);margin:0;">404</div>
    <div style="font-size:18px;color:var(--muted);margin:20px 0;">Page not found</div>
    <div style="color:var(--muted);margin-bottom:30px;">The requested URL doesn't exist on this server.</div>
    <a href="index.html" style="color:var(--secondary);text-decoration:none;border:1px solid var(--border);padding:10px 20px;border-radius:8px;transition:all var(--speed);">Return Home</a>
  </div>
</body>
</html>
