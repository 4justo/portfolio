<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>404 — Segmentation Fault</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#050505; --primary:#00FF88; --secondary:#00D9FF; --error:#FF4D4D; --muted:#999; --text:#F5F5F5; }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',ui-monospace,monospace;}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .code{color:var(--error);font-size:15px;letter-spacing:2px;margin-bottom:18px;}
  h1{font-size:22px;margin:0 0 10px;color:var(--text);}
  p{color:var(--muted);font-size:14px;max-width:440px;line-height:1.6;}
  .prompt{margin-top:26px;font-size:14px;}
  .prompt .p{color:var(--primary);}
  .prompt .c{color:var(--secondary);}
  a.btn{display:inline-block;margin-top:24px;border:1px solid var(--primary);color:var(--primary);padding:10px 18px;border-radius:8px;text-decoration:none;font-size:13px;}
  a.btn:hover{box-shadow:0 0 12px rgba(0,255,136,.45);}
  .cursor{display:inline-block;width:8px;height:16px;background:var(--primary);margin-left:4px;animation:blink 1s step-end infinite;vertical-align:middle;}
  @keyframes blink{50%{opacity:0;}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">SIGSEGV — 0x00000404</div>
    <h1>404: Route not found in the filesystem</h1>
    <p>This portfolio is a single-page OS — every section lives inside <code>index.html</code>. Whatever path you followed doesn't map to anything on disk.</p>
    <div class="prompt"><span class="p">visitor@portfolio:~$</span> <span class="c">cd /</span><span class="cursor"></span></div>
    <a class="btn" href="/index.html">← Back to Portfolio OS</a>
  </div>
</body>
</html>
